<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 14px; cursor: pointer; }
    li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>Service</h1>
  <form id="f">
    <input id="t" placeholder="Текст..." required>
    <button>Добавить</button>
  </form>
  <ul id="list"></ul>

  <script>
    const api = (p, o) => fetch(p, { headers: { 'Content-Type': 'application/json' }, ...o })
      .then(r => r.status === 204 ? null : r.json());

    async function load() {
      const items = await api('/api/items');
      document.getElementById('list').innerHTML = items.map(i =>
        `<li><span>${i.text.replace(/</g, '&lt;')}</span>
         <button onclick="del(${i.id})">×</button></li>`).join('');
    }
    async function del(id) { await api('/api/items/' + id, { method: 'DELETE' }); load(); }

    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const t = document.getElementById('t');
      await api('/api/items', { method: 'POST', body: JSON.stringify({ text: t.value }) });
      t.value = ''; load();
    };
    load();
  </script>
</body>
</html>
